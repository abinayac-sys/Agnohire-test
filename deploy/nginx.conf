# ─── AgnoHire — Production single-origin TLS (nginx) ────────────────────────
#
# Alternative to deploy/Caddyfile for environments standardized on nginx.
# Terminates TLS, serves the built SPA (client/dist), and proxies the API +
# Socket.IO to the Node server on the same origin. This is what makes the
# proctored interview's getUserMedia (camera/mic) work — it requires HTTPS.
#
# Obtain a certificate via certbot (Let's Encrypt) or your enterprise PKI and
# point ssl_certificate / ssl_certificate_key at it.

map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      close;
}

server {
    listen 80;
    server_name hire.example.com;
    return 301 https://$host$request_uri;          # force HTTPS
}

server {
    listen 443 ssl http2;
    server_name hire.example.com;

    ssl_certificate     /etc/letsencrypt/live/hire.example.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/hire.example.com/privkey.pem;

    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    client_max_body_size 20m;                       # matches in-app upload ceilings

    root /var/www/agnohire/client/dist;
    index index.html;

    # API → Node API
    location /api/ {
        proxy_pass http://127.0.0.1:4000;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Socket.IO (WebSocket upgrade)
    location /socket.io/ {
        proxy_pass http://127.0.0.1:4000;
        proxy_http_version 1.1;
        proxy_set_header Upgrade    $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_set_header Host       $host;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # SPA history-mode fallback
    location / {
        try_files $uri $uri/ /index.html;
    }
}
