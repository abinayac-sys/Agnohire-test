# ─── AgnoHire — host-level nginx in front of docker-compose.prod.yml ─────────
#
# Use this (NOT deploy/nginx.conf) when the app runs as a Docker Compose stack
# on this machine. The stack's "web" container already serves the built SPA
# and proxies /api + /socket.io to "server" — it just speaks plain HTTP on
# ${WEB_PORT} (default 3002, published to 127.0.0.1 by docker-compose.prod.yml).
#
# This host nginx does ONLY TLS termination + forwarding to that port. It does
# not serve any files itself.
#
# Obtain a certificate via certbot (Let's Encrypt) or your enterprise PKI and
# point ssl_certificate / ssl_certificate_key at it. Replace hire.example.com
# and 3002 below with your real DOMAIN / WEB_PORT from .env.

map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      close;
}

server {
    listen 80;
    server_name hire.example.com;
    return 301 https://$host$request_uri;          # force HTTPS
}

server {
    listen 443 ssl http2;
    server_name hire.example.com;

    ssl_certificate     /etc/letsencrypt/live/hire.example.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/hire.example.com/privkey.pem;

    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    client_max_body_size 20m;                       # matches in-app upload ceilings

    # Everything (SPA, /api/*, /socket.io/*) → the "web" container.
    location / {
        proxy_pass http://127.0.0.1:3002;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # WebSocket upgrade for Socket.IO must pass through explicitly.
    location /socket.io/ {
        proxy_pass http://127.0.0.1:3002;
        proxy_http_version 1.1;
        proxy_set_header Upgrade    $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_set_header Host       $host;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
